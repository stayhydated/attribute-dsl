name: cd

on:
  push:
    branches: [master]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attach pushed revision to its branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git switch --force-create "${BRANCH_NAME}" "${GITHUB_SHA}"
          git branch --set-upstream-to="origin/${BRANCH_NAME}" "${BRANCH_NAME}"

      - name: Require successful CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id=""
          for attempt in {1..12}; do
            ci_run_id="$(gh run list \
              --workflow ci.yml \
              --commit "${GITHUB_SHA}" \
              --event push \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "${ci_run_id}" ]]; then
              break
            fi
            echo "Waiting for CI run to be registered (${attempt}/12)"
            sleep 5
          done

          if [[ -z "${ci_run_id}" ]]; then
            echo "::error::No CI run found for ${GITHUB_SHA}"
            exit 1
          fi

          gh run watch "${ci_run_id}" --exit-status --interval 10

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish unpublished crate versions
        uses: release-plz/action@v0.5.133
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}
