name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI-tested revision
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${TESTED_SHA}" ]]; then
            echo "::error::Checked-out branch HEAD does not match the revision that passed CI"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish unpublished crate versions
        uses: release-plz/action@v0.5.133
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}
